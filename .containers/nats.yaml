services:
  nats:
    image: docker.io/bitnamilegacy/nats:latest
    ports:
      - '4222:4222'
      - '6222:6222'
      - '8222:8222'
    volumes:
      - ./nats-server.conf:/etc/nats-server.conf:ro
    command: ["-c", "/etc/nats-server.conf"]
