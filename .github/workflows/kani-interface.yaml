name: build-and-push-kani-interface

on:
  push:
    branches: [main, build]
    paths:
      - "src/**"
      - "apps/kani-interface/**"
      - ".github/workflows/kani-interface.yaml"
env:
  IMAGE_NAME: kani-interface
  DOCKERFILE_PATH: apps/kani-interface/Dockerfile
  BUILD_CONTEXT: .

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: kani

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Setup Docker Buildx (required for multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login Docker Registry
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push Multi-Arch image
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
