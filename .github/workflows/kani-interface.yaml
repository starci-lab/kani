name: build-and-push-kani-interface

on:
  push:
    branches: [main, build]
    paths:
      - "src/**"
      - "apps/kani-interface/**"
      - ".github/workflows/kani-interface.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-kani-interface
  cancel-in-progress: true
  
env:
  IMAGE_NAME: kani-interface
  DOCKERFILE_PATH: apps/kani-interface/Dockerfile
  BUILD_CONTEXT: .
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: kani

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Login Docker registry
      - name: Docker login
        run: |
          echo "${DOCKER_PASSWORD}" | docker login \
            ${DOCKER_REGISTRY:-docker.io} \
            -u "${DOCKER_USERNAME}" \
            --password-stdin
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # Setup buildx (Required with self-hosted)
      - name: Setup Docker buildx
        run: |
          docker buildx create --use --name kani-builder || docker buildx use kani-builder
          docker buildx inspect --bootstrap

      # Build & Push image
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f ${DOCKERFILE_PATH} \
            -t ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
            --push \
            ${BUILD_CONTEXT}
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}