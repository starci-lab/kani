name: build-and-push-kani-interface

on:
  push:
    branches: [main, master]

env:
  IMAGE_NAME: kani-interface
  DOCKERFILE_PATH: apps/kani-interface/Dockerfile
  BUILD_CONTEXT: .

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: kani

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login ${{ secrets.DOCKER_REGISTRY || 'docker.io' }} \
            -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image (single arch)
        run: |
          docker build \
            -f ${{ env.DOCKERFILE_PATH }} \
            -t ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.BUILD_CONTEXT }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest