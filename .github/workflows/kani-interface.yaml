# Workflow name shown in GitHub Actions UI
name: build-and-push-kani-interface

# Trigger the workflow on push to main or build branches
# Only run when relevant source files or the workflow itself change
on:
  push:
    branches: [main, build]
    paths:
      - "src/**"                                # Shared source code
      - "apps/kani-interface/**"                # kani-interface application
      - ".github/workflows/kani-interface.yaml" # Workflow changes

# Global environment variables reused across steps
env:
  IMAGE_NAME: kani-interface                    # Docker image name
  DOCKERFILE_PATH: apps/kani-interface/Dockerfile # Path to Dockerfile
  BUILD_CONTEXT: .                              # Docker build context

jobs:
  build-and-push:
    runs-on: self-hosted                        # Use a self-hosted GitHub runner
    environment: kani                          # GitHub Environment (secrets & protection rules)

    steps:
      # Checkout repository source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Set up Docker Buildx
      # Buildx is required for modern Docker builds and enables multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to the Docker registry
      # Credentials are stored securely in GitHub Secrets
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push the Docker image
      # The image is built for linux/amd64 and pushed to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}      # Build context
          file: ${{ env.DOCKERFILE_PATH }}       # Dockerfile location
          push: true                             # Push image after successful build
          platforms: linux/amd64                 # Target CPU architecture
          tags: |
            ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
